services:
  - type: web
    name: beacon-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: CHAIN_ID
        value: "114"
      - key: NETWORK_NAME
        value: coston2
      - key: SIMULATED_TEE
        value: "false"
      - key: FCC_MODE
        value: "verified"
      - key: TEE_ID
        value: "0xA5E9a81044dd4d66384DE09CF95dB317fde5646d"
      - key: FLARE_TEE_MANAGER
        value: "0x1a9C4A0f9D76c0b1D91d22E24E573a9b377618aE"
      - key: ENABLE_API
        value: "true"
      - key: ENABLE_FCC
        value: "true"
      - key: ENABLE_PIPELINE
        value: "true"
      - key: COSTON2_RPC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: AI_BASE_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_PROXY_URL
        sync: false
      - key: AI_PROXY_SECRET
        sync: false
      - key: AI_MODEL_GENERATOR
        sync: false
      - key: AI_MODEL_JUDGE
        sync: false
      - key: AI_MODEL_QUOTE
        sync: false
      - key: AI_MODEL_ACCEPTANCE
        sync: false
      - key: AI_REQUIRE_REAL
        value: "true"
      - key: ANTHROPIC_BASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_MODEL_PROMPT_ENGINEER
        sync: false
      - key: BEACON_AGENT_VAULT_ADDRESS
        sync: false
      - key: BEACON_SWAP_DESK_ADDRESS
        sync: false
      - key: SETTLER_PRIVATE_KEY
        sync: false
      - key: SETTLER_ADDRESS
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: DEPLOYER_ADDRESS
        sync: false
      - key: DEPLOYMENT_PRIVATE_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: X402_TOKEN_ADDRESS
        sync: false
      - key: X402_FACILITATOR_ADDRESS
        sync: false
      - key: X402_PAYEE_ADDRESS
        sync: false
      - key: BEACON_JOB_REGISTRY
        sync: false
      - key: BEACON_ESCROW
        sync: false
      - key: INSTRUCTION_SENDER
        sync: false
      - key: EXTENSION_ID
        sync: false
      - key: EXT_PROXY_URL
        value: "https://policy-handful-outlast.ngrok-free.dev"
      - key: NORMAL_PROXY_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
